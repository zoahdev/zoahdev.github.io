    <h1>Machine Permission Test（MPT）</h1>
    <p>MPT 是一组可复现的权限边界挑战：22 个用例（MPT v0.5），覆盖拒绝、一次性、重放、绑定、过期、并发、持久化、收据信任、物理约束、衰减、委派、审批分级、禁止组合等。证据包校验和寻址，任何第三方都可以离线复现，不依赖本站。</p>
    <h2>复现方式</h2>
    <p>从 GitHub 发布物下载 mpt-v0.5 证据包，运行 <code>kinegrant-mpt</code> 并执行 <code>challenge/verify_evidence.py</code> 离线核验。最新结果：22/22 PASS。</p>
    <h2>验证</h2>
    <p>可在 <a href="/verify/">浏览器验证器</a> 里直接核验 MPT 证据。</p>
